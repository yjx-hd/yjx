<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
        <div class="clocks-grid">
            <div class="clock-card">
                <h2>New York</h2>
                <p class="timezone-info">(UTC-5)</p>
                <div class="digital-clock" id="nyc">00:00:00</div>
            </div>
            <div class="clock-card">
                <h2>London</h2>
                <p class="timezone-info">(UTC+0)</p>
                <div class="digital-clock" id="london">00:00:00</div>
            </div>
            <div class="clock-card">
                <h2>Tokyo</h2>
                <p class="timezone-info">(UTC+9)</p>
                <div class="digital-clock" id="tokyo">00:00:00</div>
            </div>
            <div class="clock-card">
                <h2>Sydney</h2>
                <p class="timezone-info">(UTC+10)</p>
                <div class="digital-clock" id="sydney">00:00:00</div>
            </div>
            <div class="clock-card">
                <h2>Dubai</h2>
                <p class="timezone-info">(UTC+4)</p>
                <div class="digital-clock" id="dubai">00:00:00</div>
            </div>
            <div class="clock-card">
                <h2>São Paulo</h2>
                <p class="timezone-info">(UTC-3)</p>
                <div class="digital-clock" id="sao-paulo">00:00:00</div>
            </div>
            <div class="clock-card">
                <h2>Singapore</h2>
                <p class="timezone-info">(UTC+8)</p>
                <div class="digital-clock" id="singapore">00:00:00</div>
            </div>
            <div class="clock-card">
                <h2>Hong Kong</h2>
                <p class="timezone-info">(UTC+8)</p>
                <div class="digital-clock" id="hong-kong">00:00:00</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
